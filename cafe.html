<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Control - PMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F8FAFC; color: #0F172A; font-family: 'Inter', sans-serif; }
        .hidden-view { display: none !important; }
        .sidebar-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem; color: #64748B; transition: all 0.2s; cursor: pointer; }
        .sidebar-item:hover { background-color: #F1F5F9; color: #0F172A; }
        .sidebar-item.active { background-color: #EFF6FF; color: #2563EB; font-weight: 600; }
        .sidebar-item.active svg { color: #2563EB; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden" onclick="enableAudio()">

    <!-- Notification Sound (Short Beep) -->
    <audio id="orderBeep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div id="toast" class="hidden-view fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-6 py-3 rounded-xl text-sm font-bold shadow-2xl transition-all duration-300"></div>

    <!-- LOGIN -->
    <div id="authBox" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm text-center m-4 shadow-2xl">
            <div class="flex justify-center mb-4">
                <div class="w-12 h-12 bg-orange-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">C</div>
            </div>
            <h2 id="loginPropName" class="text-2xl font-bold text-slate-900 mb-1">Cafe Portal</h2>
            <p class="text-xs text-slate-500 mb-8 uppercase tracking-widest font-semibold">Kitchen & Menu Management</p>
            <input type="password" id="pinInput" placeholder="••••" class="w-full text-center text-3xl tracking-widest p-4 bg-slate-50 border border-slate-200 text-slate-900 rounded-xl mb-6 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
            <button onclick="login()" id="btnLogin" class="w-full bg-blue-900 text-white font-bold py-3.5 rounded-xl hover:bg-blue-800 transition shadow-md">Enter Kitchen</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="hidden-view w-64 bg-white border-r border-slate-200 flex flex-col z-20 shrink-0">
        <div class="p-6 flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-sm shadow-sm">C</div>
            <span id="sidebarPropName" class="font-bold text-slate-900 tracking-tight text-lg overflow-hidden whitespace-nowrap text-ellipsis">CAFE</span>
        </div>
        <nav class="flex-1 px-4 space-y-1">
            <div onclick="switchTab('orders')" id="nav-orders" class="sidebar-item active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Live Kitchen Orders
            </div>
            <div onclick="switchTab('menu')" id="nav-menu" class="sidebar-item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                Menu Management
            </div>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div id="mainWrapper" class="hidden-view flex-1 flex flex-col relative bg-slate-50">
        
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center z-10 shrink-0">
            <div>
                <h1 id="propTitle" class="text-2xl font-bold text-slate-900 tracking-tight">Kitchen Operations</h1>
                <p class="text-sm text-slate-500 font-medium mt-1">Manage orders and restaurant catalogue.</p>
            </div>
            <button onclick="fetchData()" id="btnSync" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm transition">Sync Kitchen</button>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar">
            
            <!-- LIVE ORDERS TAB -->
            <div id="tab-orders" class="max-w-7xl mx-auto space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 border-t-4 border-t-orange-500">
                    <h3 class="font-bold uppercase text-slate-500 tracking-wider text-sm mb-6">Approved Orders (To Prepare)</h3>
                    <div id="kitchenOrders" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <!-- MENU MANAGEMENT TAB -->
            <div id="tab-menu" class="hidden-view max-w-7xl mx-auto space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-slate-900 mb-4">Add New Dish</h3>
                    <div class="flex flex-col md:flex-row gap-4">
                        <select id="mCategory" class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-sm font-semibold outline-none focus:border-blue-600 transition-colors">
                            <option value="Breakfast">Breakfast</option>
                            <option value="Main Course">Main Course</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Dessert">Dessert</option>
                        </select>
                        <input type="text" id="mItemName" placeholder="Dish Name" class="flex-1 bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-sm font-semibold outline-none focus:border-blue-600 transition-colors">
                        <input type="number" id="mPrice" placeholder="Price (₹)" class="w-full md:w-32 bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-sm font-semibold outline-none focus:border-blue-600 transition-colors">
                        <button onclick="addMenuItem()" id="btnAddMenu" class="bg-blue-900 hover:bg-blue-800 text-white px-8 py-3.5 rounded-xl font-bold text-sm shadow-sm transition">Add to Menu</button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                    <h3 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-3">Current Catalogue</h3>
                    <table class="w-full text-left text-sm min-w-max">
                        <thead><tr class="text-slate-400 uppercase tracking-wider text-[10px] border-b border-slate-100"><th class="py-3">Category</th><th>Item</th><th>Price</th><th class="text-right">Action</th></tr></thead>
                        <tbody id="menuTable" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('hotel');
        let client = null;
        let diningData = null;
        let lastOrderCount = 0;
        let audioEnabled = false;

        function enableAudio() {
            if (!audioEnabled) {
                document.getElementById('orderBeep').play().then(() => {
                    document.getElementById('orderBeep').pause();
                    document.getElementById('orderBeep').currentTime = 0;
                    audioEnabled = true;
                }).catch(e => console.log("Audio play blocked."));
            }
        }

        function playBeep() {
            if (audioEnabled) {
                document.getElementById('orderBeep').play().catch(e => console.log(e));
            }
        }

        function notify(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.classList.remove('hidden-view');
            setTimeout(() => el.classList.add('hidden-view'), 3500);
        }

        async function init() {
            const res = await fetch(`masterdata.json?_ts=${Date.now()}`);
            const data = await res.json();
            client = data[slug];
            if(client) {
                document.getElementById('loginPropName').innerText = client.name + ' Cafe';
            }
        }

        function switchTab(tabId) {
            ['orders', 'menu'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden-view');
                document.getElementById(`nav-${t}`).classList.remove('active');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden-view');
            document.getElementById(`nav-${tabId}`).classList.add('active');
        }

        function login() {
            const pin = document.getElementById('pinInput').value;
            const btn = document.getElementById('btnLogin');
            const origText = btn.innerText;
            btn.innerText = "Verifying...";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            fetch(`${client.scriptUrl}?action=getDiningData&pin=${pin}`)
                .then(r=>r.json()).then(res => {
                    btn.innerText = origText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');

                    if(res.success) {
                        diningData = res;
                        document.getElementById('propTitle').innerText = `${client.name} - Kitchen`;
                        document.getElementById('sidebarPropName').innerHTML = `${client.name} <span class="text-orange-500 ml-1">CAFE</span>`;

                        document.getElementById('authBox').classList.add('hidden-view');
                        document.getElementById('sidebar').classList.remove('hidden-view');
                        document.getElementById('mainWrapper').classList.remove('hidden-view');
                        
                        // Set initial count so it doesn't beep on first load
                        lastOrderCount = res.recentOrders.filter(o => o.Status === "Approved").length;
                        renderUI();
                        
                        // Poll for new orders
                        setInterval(fetchDataSilent, 10000);

                    } else notify(res.error || "Incorrect Kitchen PIN");
                }).catch(() => {
                    btn.innerText = origText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    notify("Connection failed.");
                });
        }

        function fetchDataSilent() {
             const pin = document.getElementById('pinInput').value;
             fetch(`${client.scriptUrl}?action=getDiningData&pin=${pin}`)
                .then(r=>r.json()).then(res => {
                    if(res.success) {
                        diningData = res;
                        const approvedOrders = diningData.recentOrders.filter(o => o.Status === "Approved");
                        if (approvedOrders.length > lastOrderCount) {
                            playBeep(); // Beep on new approved order
                        }
                        lastOrderCount = approvedOrders.length;
                        renderUI();
                    }
                });
        }

        function fetchData() { 
            const btn = document.getElementById('btnSync');
            const orig = btn.innerText;
            btn.innerText = "Syncing...";
            btn.disabled = true;
            fetchDataSilent();
            setTimeout(() => { btn.innerText = orig; btn.disabled = false; }, 1000);
        }

        function renderUI() {
            // Render Orders
            const kOrders = document.getElementById('kitchenOrders');
            kOrders.innerHTML = "";
            const approvedOrders = diningData.recentOrders.filter(o => o.Status === "Approved");
            
            if(approvedOrders.length === 0) {
                kOrders.innerHTML = "<div class='col-span-1 xl:col-span-2 p-8 text-center bg-slate-50 border border-dashed border-slate-200 rounded-xl'><p class='text-slate-500 font-semibold text-sm'>No active orders pending for preparation.</p></div>";
            }
            
            approvedOrders.forEach(o => {
                let paymentBadge = o.PaymentStatus === 'Paid via UPI' || o.PaymentStatus === 'Paid' 
                                   ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold">PAID</span>`
                                   : `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[10px] font-bold">ROOM CHARGE</span>`;
                
                kOrders.innerHTML += `<div class="p-6 border border-slate-200 rounded-2xl bg-white shadow-sm hover:shadow-md transition">
                    <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-4">
                        <div>
                            <span class="font-bold text-xl text-slate-900 block">Room ${o.RoomNo}</span>
                            ${paymentBadge}
                        </div>
                        <span class="text-[10px] bg-orange-50 text-orange-600 border border-orange-100 px-3 py-1 rounded font-bold uppercase tracking-wider">Preparing</span>
                    </div>
                    <p class="font-semibold text-sm text-slate-600 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">${o.Items}</p>
                    <button onclick="markDone('${o.OrderId}', this)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-sm shadow-sm transition active:scale-95">Mark Order Ready</button>
                </div>`;
            });

            // Render Menu
            const mTable = document.getElementById('menuTable');
            mTable.innerHTML = "";
            diningData.menu.forEach(m => {
                mTable.innerHTML += `<tr class="hover:bg-slate-50 transition border-b border-slate-100">
                    <td class="py-4 text-slate-500 text-xs uppercase font-bold tracking-wider">${m.Category}</td>
                    <td class="py-4 font-bold text-slate-900">${m.ItemName}</td>
                    <td class="py-4 font-mono font-bold text-slate-900">₹${m.Price}</td>
                    <td class="py-4 text-right"><button onclick="removeMenu('${m.ItemId}', this)" class="text-red-600 hover:text-red-700 text-xs font-bold uppercase tracking-wider bg-red-50 px-3 py-1.5 rounded hover:bg-red-100 transition">Delete</button></td>
                </tr>`;
            });
        }

        function markDone(orderId, btn) {
            const orig = btn.innerText;
            btn.innerText = "Updating...";
            btn.disabled = true;
            fetch(client.scriptUrl, { method:"POST", body: JSON.stringify({ action: "completeOrder", orderId: orderId }) })
            .then(()=> { fetchDataSilent(); });
        }

        function addMenuItem() {
            const btn = document.getElementById('btnAddMenu');
            const orig = btn.innerText;
            btn.innerText = "Adding...";
            btn.disabled = true;
            
            fetch(client.scriptUrl, { method:"POST", body: JSON.stringify({ action: "addMenu", 
                category: document.getElementById('mCategory').value, name: document.getElementById('mItemName').value, price: document.getElementById('mPrice').value 
            })}).then(()=> { 
                document.getElementById('mItemName').value=""; 
                document.getElementById('mPrice').value="";
                btn.innerText = orig;
                btn.disabled = false;
                fetchDataSilent(); 
            });
        }

        function removeMenu(id, btn) {
            if(confirm("Permanently remove this item from the catalogue?")) {
                btn.innerText = "...";
                btn.disabled = true;
                fetch(client.scriptUrl, { method:"POST", body: JSON.stringify({ action: "removeMenu", itemId: id }) }).then(()=> fetchDataSilent());
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            init();
        });
    </script>
</body>
</html>
