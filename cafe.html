<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Control - Ofbuzz PMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #f8fafc; color: #0f172a; } .hidden-view { display: none !important; }</style>
</head>
<body class="flex h-screen overflow-hidden font-sans">

    <!-- LOGIN -->
    <div id="authBox" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96 text-center m-4">
            <h2 class="text-2xl font-black text-orange-600 mb-1">Cafe Portal</h2>
            <p class="text-xs text-slate-500 mb-6 uppercase tracking-wider">Kitchen & Menu Management</p>
            <input type="password" id="pinInput" placeholder="••••" class="w-full text-center text-3xl font-mono p-3 border rounded-xl mb-4 outline-none">
            <button onclick="login()" class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl hover:bg-orange-700 transition">Enter Kitchen</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="hidden-view w-64 bg-orange-900 text-white flex flex-col z-10 relative">
        <div class="p-6 font-black text-xl tracking-tight border-b border-orange-800">OFBUZZ<span class="text-orange-300">CAFE</span></div>
        <nav class="flex-1 p-4 space-y-2 text-sm font-semibold text-orange-100">
            <button onclick="switchTab('orders')" class="w-full text-left p-3 rounded-lg hover:bg-orange-800 transition">Live Kitchen Orders</button>
            <button onclick="switchTab('menu')" class="w-full text-left p-3 rounded-lg hover:bg-orange-800 transition">Menu Management</button>
            <button onclick="switchTab('settings')" class="w-full text-left p-3 rounded-lg hover:bg-orange-800 transition">Restaurant Info</button>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div id="mainWrapper" class="hidden-view flex-1 flex flex-col relative bg-slate-50">
        
        <main class="flex-1 overflow-y-auto p-8 relative z-10">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <!-- HOTEL NAME DYNAMICALLY ADDED HERE -->
                    <h1 id="propTitle" class="text-3xl font-black text-slate-800 uppercase tracking-tight">Kitchen Operations</h1>
                    <p class="text-slate-500 text-sm mt-1">Manage orders and restaurant catalogue.</p>
                </div>
                <button onclick="fetchData()" class="bg-white border shadow-sm px-4 py-2 rounded-lg text-sm font-bold text-slate-700 hover:bg-slate-100 transition">Sync Kitchen</button>
            </header>

            <!-- LIVE ORDERS TAB -->
            <div id="tab-orders" class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-orange-500">
                    <h3 class="font-bold uppercase text-orange-600 text-sm mb-4">Approved Orders (To Prepare)</h3>
                    <div id="kitchenOrders" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <!-- MENU MANAGEMENT TAB -->
            <div id="tab-menu" class="hidden-view space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4">Add New Dish</h3>
                    <div class="flex flex-col md:flex-row gap-3">
                        <select id="mCategory" class="border p-3 rounded-xl text-sm outline-none focus:border-orange-500"><option value="Breakfast">Breakfast</option><option value="Main Course">Main Course</option><option value="Beverages">Beverages</option></select>
                        <input type="text" id="mItemName" placeholder="Dish Name" class="flex-1 border p-3 rounded-xl text-sm outline-none focus:border-orange-500">
                        <input type="number" id="mPrice" placeholder="Price (₹)" class="w-full md:w-32 border p-3 rounded-xl text-sm outline-none focus:border-orange-500">
                        <button onclick="addMenuItem()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-sm transition">Add to Menu</button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                    <h3 class="text-lg font-bold mb-4 border-b pb-2">Current Catalogue</h3>
                    <table class="w-full text-left text-sm min-w-max">
                        <thead><tr class="text-slate-400 uppercase text-[10px] border-b"><th class="py-3">Category</th><th>Item</th><th>Price</th><th class="text-right">Action</th></tr></thead>
                        <tbody id="menuTable" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <!-- SETTINGS TAB -->
            <div id="tab-settings" class="hidden-view space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-md">
                    <h3 class="text-lg font-bold mb-4">Restaurant Details</h3>
                    <div class="space-y-4">
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Cafe Support Contact</label><input type="text" value="+91-9876543210" class="w-full border p-3 rounded-xl mt-1 outline-none"></div>
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Opening Time</label><input type="time" value="07:00" class="w-full border p-3 rounded-xl mt-1 outline-none"></div>
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Closing Time</label><input type="time" value="23:00" class="w-full border p-3 rounded-xl mt-1 outline-none"></div>
                        <button class="bg-slate-800 text-white w-full py-3 rounded-xl font-bold shadow hover:bg-slate-700 transition">Update Info</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- ORIGINAL OFBUZZ FOOTER -->
        <footer class="bg-white border-t border-gray-200 py-6 text-xs w-full relative z-10">
            <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" alt="Ofbuzz Logo" class="w-7 h-7 rounded-full object-cover border border-gray-300">
                    <div>
                        <p class="font-bold uppercase tracking-wider text-black">Ofbuzz Technology</p>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest">Ofbuzz PMS &bull; An Indian Technology</p>
                    </div>
                </div>
                <a href="https://wa.me/917827201014" target="_blank" class="border border-gray-300 text-black px-4 py-2 rounded-xl text-[11px] font-semibold hover:bg-gray-100 active:scale-95 transition-all cursor-pointer">
                    Support Desk
                </a>
            </div>
        </footer>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('hotel');
        let client = null;
        let diningData = null;

        async function init() {
            const res = await fetch(`masterdata.json?_ts=${Date.now()}`);
            const data = await res.json();
            client = data[slug];
        }

        function switchTab(tabId) {
            ['orders', 'menu', 'settings'].forEach(t => document.getElementById(`tab-${t}`).classList.add('hidden-view'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden-view');
        }

        function login() {
            const pin = document.getElementById('pinInput').value;
            fetch(`${client.scriptUrl}?action=getDiningData&pin=${pin}`)
                .then(r=>r.json()).then(res => {
                    if(res.success) {
                        diningData = res;
                        
                        // HOTEL NAME ADDED TO HEADER HERE
                        document.getElementById('propTitle').innerText = `${res.propertyName} - Cafe Hub`;

                        document.getElementById('authBox').classList.add('hidden-view');
                        document.getElementById('sidebar').classList.remove('hidden-view');
                        document.getElementById('mainWrapper').classList.remove('hidden-view');
                        renderUI();
                    } else alert(res.error || "Incorrect Kitchen PIN");
                });
        }

        function fetchData() { login(); }

        function renderUI() {
            // Render Orders (Only those approved by Reception)
            const kOrders = document.getElementById('kitchenOrders');
            kOrders.innerHTML = "";
            const approvedOrders = diningData.recentOrders.filter(o => o.Status === "Approved");
            if(approvedOrders.length === 0) kOrders.innerHTML = "<p class='text-slate-400 text-sm col-span-2'>No active orders pending for preparation.</p>";
            
            approvedOrders.forEach(o => {
                kOrders.innerHTML += `<div class="p-5 border border-orange-200 rounded-2xl bg-orange-50/80 shadow-sm hover:shadow-md transition">
                    <div class="flex justify-between items-start mb-3 border-b border-orange-200 pb-3">
                        <span class="font-black text-xl text-slate-800">Room ${o.RoomNo}</span>
                        <span class="text-[10px] bg-orange-200 text-orange-800 px-3 py-1 rounded-full font-bold uppercase tracking-wider">Preparing</span>
                    </div>
                    <p class="font-mono text-sm text-slate-700 mb-4 bg-white p-3 rounded-lg border border-orange-100">${o.Items}</p>
                    <button onclick="markDone('${o.OrderId}')" class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest shadow-sm transition">Mark Order Ready</button>
                </div>`;
            });

            // Render Menu
            const mTable = document.getElementById('menuTable');
            mTable.innerHTML = "";
            diningData.menu.forEach(m => {
                mTable.innerHTML += `<tr class="hover:bg-slate-50 transition">
                    <td class="py-4 text-slate-500 text-xs uppercase font-bold tracking-wider">${m.Category}</td>
                    <td class="py-4 font-black text-slate-800">${m.ItemName}</td>
                    <td class="py-4 font-mono text-indigo-600 font-bold">₹${m.Price}</td>
                    <td class="py-4 text-right"><button onclick="removeMenu('${m.ItemId}')" class="text-red-500 hover:text-red-700 text-xs font-bold uppercase tracking-wider">Delete</button></td>
                </tr>`;
            });
        }

        function markDone(orderId) {
            fetch(client.scriptUrl, { method:"POST", body: JSON.stringify({ action: "completeOrder", orderId: orderId }) })
            .then(()=> fetchData());
        }

        function addMenuItem() {
            fetch(client.scriptUrl, { method:"POST", body: JSON.stringify({ action: "addMenu", 
                category: document.getElementById('mCategory').value, name: document.getElementById('mItemName').value, price: document.getElementById('mPrice').value 
            })}).then(()=> { document.getElementById('mItemName').value=""; fetchData(); });
        }

        function removeMenu(id) {
            if(confirm("Permanently remove this item from the catalogue?")) {
                fetch(client.scriptUrl, { method:"POST", body: JSON.stringify({ action: "removeMenu", itemId: id }) }).then(()=> fetchData());
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            init();
        });
    </script>
</body>
</html>
