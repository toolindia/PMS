<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Portal - Ofbuzz PMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fafafa; color: #111; }
        .hidden-view { display: none !important; }
        .tab-active { border-bottom: 3px solid #dc2626; color: #dc2626; font-weight: 900; }
        .rating-btn.active { background-color: #dc2626; color: #ffffff; border-color: #dc2626; transform: scale(1.05); }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 min-h-screen flex flex-col">

    <div id="toast" class="hidden-view fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white px-5 py-3 rounded-xl text-sm font-bold shadow-2xl transition-all duration-300"></div>

    <!-- HEADER -->
    <header class="bg-red-600 text-white p-5 shadow-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 id="bPropName" class="text-xl font-black tracking-tight uppercase">Guest Portal <span id="networkStatus" class="text-green-300 text-xs ml-2">• Online</span></h1>
            <span class="text-[10px] font-bold bg-white text-red-600 px-3 py-1.5 rounded-full shadow tracking-widest uppercase">Powered by Ofbuzz</span>
        </div>
    </header>

    <!-- LOADING SCREEN -->
    <div id="loader" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
        <div class="w-12 h-12 border-4 border-red-200 border-t-red-600 rounded-full animate-spin mb-4"></div>
        <p class="font-bold text-gray-500 uppercase tracking-widest text-sm">Connecting to Reception...</p>
    </div>

    <main id="mainContent" class="hidden-view flex-1 max-w-5xl mx-auto w-full p-4 sm:p-6 mt-2">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6 flex flex-col sm:flex-row gap-4 items-center">
            <div class="flex-1 w-full">
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Your Room Number</label>
                <input type="text" id="guestRoom" placeholder="Enter Room No" class="w-full border border-gray-300 p-3 rounded-xl outline-none focus:border-red-500 font-bold text-lg text-center sm:text-left transition">
            </div>
            <div class="flex-1 w-full text-center sm:text-right">
                <p class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-1">Total Cart Value</p>
                <p id="cartTotal" class="text-3xl font-black text-red-600">₹0</p>
            </div>
        </div>

        <!-- TABS -->
        <div class="flex border-b border-gray-200 mb-6">
            <button onclick="switchTab('food')" id="tabBtn-food" class="flex-1 py-3 uppercase tracking-wider text-sm font-bold text-gray-500 tab-active transition">Room Service Menu</button>
            <button onclick="switchTab('feedback')" id="tabBtn-feedback" class="flex-1 py-3 uppercase tracking-wider text-sm font-bold text-gray-500 transition">Rate Your Stay</button>
        </div>

        <!-- FOOD MENU TAB -->
        <div id="tab-food" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- MENU LIST -->
                <div class="space-y-4">
                    <h3 class="font-black text-xl mb-2 text-gray-800">Browse Menu</h3>
                    <div id="menuContainer" class="space-y-3"></div>
                </div>

                <!-- CART -->
                <div class="bg-gray-50 p-6 rounded-2xl border border-gray-200 h-fit sticky top-24">
                    <h3 class="font-black text-xl mb-4 text-gray-800 border-b pb-2">Your Order</h3>
                    <div id="cartItemsList" class="space-y-3 mb-6 min-h-[100px]">
                        <p class="text-sm font-bold text-gray-400 text-center mt-8">Your cart is empty.</p>
                    </div>
                    <button id="btnPlaceOrder" onclick="placeOrder()" class="w-full bg-red-600 text-white font-black uppercase tracking-wider py-4 rounded-xl shadow-md hover:bg-red-700 transition transform hover:scale-[1.02]">Send Order to Kitchen</button>
                </div>
            </div>
        </div>

        <!-- FEEDBACK TAB -->
        <div id="tab-feedback" class="hidden-view bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-black text-2xl mb-2 text-gray-800">How was your stay?</h3>
            <p class="text-gray-500 text-sm mb-6 border-b pb-4">Please rate the following services out of 5 to help us improve.</p>

            <div class="space-y-6">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase block mb-2 tracking-wider">Cleanliness & Hygiene</label>
                    <div class="grid grid-cols-5 gap-3" data-metric="cleanliness">
                        <button onclick="setScore('cleanliness', 1)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold hover:bg-gray-50 transition">1</button>
                        <button onclick="setScore('cleanliness', 2)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold hover:bg-gray-50 transition">2</button>
                        <button onclick="setScore('cleanliness', 3)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold hover:bg-gray-50 transition">3</button>
                        <button onclick="setScore('cleanliness', 4)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold hover:bg-gray-50 transition">4</button>
                        <button onclick="setScore('cleanliness', 5)" class="rating-btn active border border-gray-300 py-2 rounded-xl font-bold hover:bg-gray-50 transition">5</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase block mb-2 tracking-wider">Staff Courtesy & Service</label>
                    <div class="grid grid-cols-5 gap-3" data-metric="staff">
                        <button onclick="setScore('staff', 1)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">1</button>
                        <button onclick="setScore('staff', 2)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">2</button>
                        <button onclick="setScore('staff', 3)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">3</button>
                        <button onclick="setScore('staff', 4)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">4</button>
                        <button onclick="setScore('staff', 5)" class="rating-btn active border border-gray-300 py-2 rounded-xl font-bold transition">5</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase block mb-2 tracking-wider">Food & Beverages</label>
                    <div class="grid grid-cols-5 gap-3" data-metric="food">
                        <button onclick="setScore('food', 1)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">1</button>
                        <button onclick="setScore('food', 2)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">2</button>
                        <button onclick="setScore('food', 3)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">3</button>
                        <button onclick="setScore('food', 4)" class="rating-btn border border-gray-300 py-2 rounded-xl font-bold transition">4</button>
                        <button onclick="setScore('food', 5)" class="rating-btn active border border-gray-300 py-2 rounded-xl font-bold transition">5</button>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <label class="text-xs font-bold text-gray-500 uppercase block mb-2 tracking-wider">Additional Comments</label>
                    <textarea id="custComments" rows="4" placeholder="Tell us more about your experience..." class="w-full border border-gray-300 p-4 rounded-xl outline-none focus:border-red-500 transition"></textarea>
                </div>

                <button id="btnFeedback" onclick="submitFeedback()" class="w-full bg-red-600 text-white font-black uppercase tracking-wider py-4 rounded-xl shadow-md hover:bg-red-700 transition transform hover:scale-[1.02]">Submit Evaluation</button>
            </div>
        </div>

    </main>

    <!-- OFBUZZ FOOTER (With Dynamic Hotel Contact) -->
    <footer class="bg-white border-t border-gray-200 py-6 mt-auto text-xs w-full">
        <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" alt="Ofbuzz Logo" class="w-7 h-7 rounded-full object-cover border border-gray-300">
                <div>
                    <p class="font-bold uppercase tracking-wider text-black">Ofbuzz Technology</p>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest">Ofbuzz PMS &bull; An Indian Technology</p>
                </div>
            </div>
            <!-- DYNAMIC HOTEL CONTACT NUMBER WILL BE INJECTED HERE -->
            <a id="supportBtn" href="#" class="bg-red-50 border border-red-200 text-red-700 px-5 py-2.5 rounded-xl text-[11px] font-bold hover:bg-red-100 active:scale-95 transition-all cursor-pointer shadow-sm flex items-center gap-2">
                📞 Call Reception
            </a>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('hotel');
        let client = null, cart = {}, menuItems = [];
        const scores = { cleanliness: 5, staff: 5, amenities: 5, food: 5 };

        function notify(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.classList.remove('hidden-view');
            setTimeout(() => el.classList.add('hidden-view'), 3500);
        }

        // OFFLINE SYNC WRAPPER FOR GUEST PORTAL
        function apiCall(payload, btnElem, loadingText, callback) {
            const originalText = btnElem ? btnElem.innerText : "";
            if(btnElem) { btnElem.innerText = loadingText; btnElem.disabled = true; btnElem.classList.add('opacity-50', 'cursor-not-allowed'); }
            
            if(!navigator.onLine && payload.action !== 'getCustomerPortalData') {
                let queue = JSON.parse(localStorage.getItem('pms_offline_queue') || '[]');
                queue.push(payload);
                localStorage.setItem('pms_offline_queue', JSON.stringify(queue));
                if(btnElem) { btnElem.innerText = originalText; btnElem.disabled = false; btnElem.classList.remove('opacity-50', 'cursor-not-allowed'); }
                notify("Offline: Request saved. It will sync automatically when network restores.");
                if(callback) callback({success: true, offline: true});
                return;
            }

            fetch(client.scriptUrl, { method: "POST", body: JSON.stringify(payload) })
            .then(r=>r.json()).then(res => {
                if(btnElem) { btnElem.innerText = originalText; btnElem.disabled = false; btnElem.classList.remove('opacity-50', 'cursor-not-allowed'); }
                if(callback) callback(res);
            }).catch(err => {
                if(btnElem) { btnElem.innerText = originalText; btnElem.disabled = false; btnElem.classList.remove('opacity-50', 'cursor-not-allowed'); }
                notify("Network communication failed.");
            });
        }

        window.addEventListener('online', () => { document.getElementById('networkStatus').innerHTML = "<span class='text-green-300'>• Online</span>"; syncOffline(); });
        window.addEventListener('offline', () => document.getElementById('networkStatus').innerHTML = "<span class='text-red-300'>• Offline</span>");

        function syncOffline() {
            if(!navigator.onLine) return;
            let queue = JSON.parse(localStorage.getItem('pms_offline_queue') || '[]');
            if(queue.length === 0) return;
            
            notify(`Syncing offline requests...`);
            fetch(client.scriptUrl, { method: "POST", body: JSON.stringify({ action: "syncOfflineData", payloads: queue }) })
            .then(r=>r.json()).then(res => { if(res.success) localStorage.removeItem('pms_offline_queue'); });
        }

        async function init() {
            const res = await fetch(`masterdata.json?_ts=${Date.now()}`);
            const data = await res.json();
            client = data[slug];
            
            if(client) {
                document.getElementById('bPropName').innerHTML = `${client.name} <span id="networkStatus" class="text-green-300 text-[10px] ml-2 font-bold tracking-widest uppercase">• Online</span>`;
                fetchData();
            } else {
                document.getElementById('loader').innerHTML = "<p class='font-bold text-red-500'>Hotel Not Found in Registry</p>";
            }
        }

        function fetchData() {
            fetch(`${client.scriptUrl}?action=getCustomerPortalData`)
                .then(r=>r.json()).then(res => {
                    if(res.success) {
                        menuItems = res.menu || [];
                        document.getElementById('supportBtn').href = `tel:${res.hotelContact}`;
                        document.getElementById('loader').classList.add('hidden-view');
                        document.getElementById('mainContent').classList.remove('hidden-view');
                        renderMenu();
                        syncOffline(); // Initial sync check
                    }
                });
        }

        function switchTab(tabId) {
            ['food', 'feedback'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden-view');
                document.getElementById(`tabBtn-${t}`).classList.remove('tab-active');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden-view');
            document.getElementById(`tabBtn-${tabId}`).classList.add('tab-active');
        }

        function renderMenu() {
            const el = document.getElementById('menuContainer');
            el.innerHTML = "";
            menuItems.forEach(item => {
                el.innerHTML += `
                    <div class="bg-white border border-gray-200 p-4 rounded-xl flex justify-between items-center hover:shadow-md transition">
                        <div>
                            <span class="font-black text-gray-800 block text-lg">${item.ItemName}</span>
                            <span class="text-xs text-gray-400 uppercase font-bold tracking-wider">${item.Category}</span>
                            <p class="text-xs text-gray-500 mt-1">${item.Description || ''}</p>
                            <span class="block text-red-600 font-bold mt-2">₹${item.Price}</span>
                        </div>
                        <button onclick="addToCart('${item.ItemId}', '${item.ItemName}', ${item.Price})" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2 rounded-lg text-xs font-black uppercase tracking-wider active:scale-95 transition-all shadow-sm">
                            Add +
                        </button>
                    </div>
                `;
            });
        }

        function addToCart(id, name, price) {
            if (cart[id]) cart[id].qty++; else cart[id] = { name: name, price: price, qty: 1 };
            renderCart();
        }

        function renderCart() {
            const el = document.getElementById('cartItemsList');
            el.innerHTML = "";
            let sum = 0;
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                el.innerHTML = `<p class="text-sm font-bold text-gray-400 text-center mt-8">Your cart is empty.</p>`;
            } else {
                keys.forEach(k => {
                    const line = cart[k];
                    const itemSum = line.qty * line.price;
                    sum += itemSum;
                    el.innerHTML += `
                        <div class="flex justify-between items-center py-2 border-b border-gray-200">
                            <div><span class="font-bold text-gray-800">${line.name}</span> <span class="text-gray-400 text-xs ml-1">x${line.qty}</span></div>
                            <span class="font-black text-gray-900">₹${itemSum}</span>
                        </div>
                    `;
                });
            }
            document.getElementById('cartTotal').innerText = `₹${sum}`;
        }

        function placeOrder() {
            const room = document.getElementById('guestRoom').value.trim();
            const keys = Object.keys(cart);
            if (!room) return alert("Please enter your Room Number first.");
            if (keys.length === 0) return alert("Add items to your cart first.");

            let summary = [], totalAmount = 0;
            keys.forEach(k => { summary.push(`${cart[k].name} (${cart[k].qty})`); totalAmount += (cart[k].qty * cart[k].price); });

            const payload = { action: "placeOrder", roomNo: room, items: summary.join(", "), amount: totalAmount };
            apiCall(payload, document.getElementById('btnPlaceOrder'), "Sending Order...", res => {
                cart = {}; renderCart();
                notify(res.offline ? "Order saved offline." : "Order sent successfully to Reception!");
            });
        }

        function setScore(metric, val) {
            scores[metric] = val;
            const container = document.querySelector(`[data-metric="${metric}"]`);
            container.querySelectorAll('.rating-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === val);
            });
        }

        function submitFeedback() {
            const room = document.getElementById('guestRoom').value.trim();
            if (!room) return alert("Please enter your Room Number at the top.");

            const payload = {
                action: "submitFeedback", roomNo: room, guestName: "Guest",
                cleanliness: scores.cleanliness, staff: scores.staff, amenities: scores.amenities, food: scores.food,
                comments: document.getElementById('custComments').value.trim()
            };
            
            apiCall(payload, document.getElementById('btnFeedback'), "Submitting...", res => {
                document.getElementById('tab-feedback').innerHTML = `
                    <div class="text-center py-10">
                        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner">✓</div>
                        <h2 class="text-2xl font-black mb-2 text-gray-800">Thank You!</h2>
                        <p class="text-gray-500 text-sm">Your feedback helps us provide better service.</p>
                    </div>`;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
