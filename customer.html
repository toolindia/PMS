<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Evaluation - Ofbuzz PMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #FAF7F2; color: #111111; }
        .text-maroon { color: #800020; }
        .bg-maroon { background-color: #800020; }
        .border-maroon { border-color: #800020; }
        .hidden-view { display: none !important; }
        .rating-btn.active { background-color: #800020; color: #ffffff; border-color: #800020; transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-[#800020] selection:text-white">

    <div id="toast" class="hidden-view fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 text-white px-5 py-2.5 rounded-xl text-xs font-mono border border-neutral-700 shadow-xl"></div>

    <main class="w-full max-w-lg mx-auto p-4 sm:p-6 flex-1 space-y-5">

        <header class="bg-white border border-neutral-200 rounded-2xl p-5 text-center shadow-xs space-y-1">
            <h1 id="propTitle" class="text-lg sm:text-xl font-black uppercase tracking-tight text-maroon">Service Evaluation</h1>
            <p class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Guest Stay Impressions</p>
        </header>

        <div id="formCard" class="bg-white border border-neutral-200 rounded-2xl p-5 sm:p-6 shadow-xs space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-bold uppercase text-neutral-500 block mb-1">Room Allocation</label>
                    <input type="text" id="custRoom" placeholder="Room No" class="w-full px-3 py-2 border border-neutral-200 rounded-xl text-xs font-mono focus:outline-none focus:border-maroon transition-colors">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-neutral-500 block mb-1">Guest Full Name</label>
                    <input type="text" id="custName" placeholder="Full Name" class="w-full px-3 py-2 border border-neutral-200 rounded-xl text-xs focus:outline-none focus:border-maroon transition-colors">
                </div>
            </div>

            <div class="space-y-3 pt-2 border-t border-neutral-100">
                <div>
                    <label class="text-xs font-bold uppercase block mb-1">Cleanliness & Hygiene</label>
                    <div class="grid grid-cols-5 gap-2" data-metric="cleanliness">
                        <button type="button" onclick="setScore('cleanliness', 1)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">1</button>
                        <button type="button" onclick="setScore('cleanliness', 2)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">2</button>
                        <button type="button" onclick="setScore('cleanliness', 3)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">3</button>
                        <button type="button" onclick="setScore('cleanliness', 4)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">4</button>
                        <button type="button" onclick="setScore('cleanliness', 5)" class="rating-btn active border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">5</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase block mb-1">Staff Courtesy</label>
                    <div class="grid grid-cols-5 gap-2" data-metric="staff">
                        <button type="button" onclick="setScore('staff', 1)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">1</button>
                        <button type="button" onclick="setScore('staff', 2)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">2</button>
                        <button type="button" onclick="setScore('staff', 3)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">3</button>
                        <button type="button" onclick="setScore('staff', 4)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">4</button>
                        <button type="button" onclick="setScore('staff', 5)" class="rating-btn active border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">5</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase block mb-1">Room Amenities</label>
                    <div class="grid grid-cols-5 gap-2" data-metric="amenities">
                        <button type="button" onclick="setScore('amenities', 1)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">1</button>
                        <button type="button" onclick="setScore('amenities', 2)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">2</button>
                        <button type="button" onclick="setScore('amenities', 3)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">3</button>
                        <button type="button" onclick="setScore('amenities', 4)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">4</button>
                        <button type="button" onclick="setScore('amenities', 5)" class="rating-btn active border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">5</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase block mb-1">Food & Beverage Quality</label>
                    <div class="grid grid-cols-5 gap-2" data-metric="food">
                        <button type="button" onclick="setScore('food', 1)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">1</button>
                        <button type="button" onclick="setScore('food', 2)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">2</button>
                        <button type="button" onclick="setScore('food', 3)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">3</button>
                        <button type="button" onclick="setScore('food', 4)" class="rating-btn border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">4</button>
                        <button type="button" onclick="setScore('food', 5)" class="rating-btn active border border-neutral-200 py-1.5 rounded-xl text-xs font-mono hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">5</button>
                    </div>
                </div>
            </div>

            <div class="border-t border-neutral-100 pt-2">
                <label class="text-[10px] font-bold uppercase text-neutral-500 block mb-1">Observations / Suggestions</label>
                <textarea id="custComments" rows="3" class="w-full px-3 py-2 border border-neutral-200 rounded-xl text-xs focus:outline-none focus:border-maroon transition-colors"></textarea>
            </div>

            <button onclick="submitFeedback()" id="btnSubmit" class="w-full bg-maroon text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider hover:opacity-90 active:scale-95 transition-all shadow-md cursor-pointer">
                Transmit Evaluation
            </button>
        </div>

        <div id="successCard" class="hidden-view bg-white border border-neutral-200 rounded-2xl p-8 text-center space-y-3">
            <h2 class="text-base font-bold uppercase text-maroon">Feedback Acknowledged</h2>
            <p class="text-xs text-neutral-600">Thank you for rating your stay. Your observations are noted for internal quality review.</p>
        </div>

    </main>

    <footer class="bg-white border-t border-neutral-200 py-6 mt-12 text-xs">
        <div class="max-w-lg mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="https://i.pinimg.com/736x/bd/d0/5c/bdd05c94afb66b5a72f5e17a7a879ab3.jpg" alt="Ofbuzz Logo" class="w-7 h-7 rounded-full object-cover border border-neutral-300">
                <div>
                    <p class="font-bold uppercase tracking-wider text-black">Ofbuzz Technology</p>
                    <p class="text-[10px] text-neutral-400 uppercase tracking-widest">Ofbuzz PMS &bull; An Indian Technology</p>
                </div>
            </div>
            <a href="https://wa.me/917827201014" target="_blank" class="border border-neutral-300 text-black px-4 py-2 rounded-xl text-[11px] font-semibold hover:bg-neutral-100 active:scale-95 transition-all cursor-pointer">
                Support Desk
            </a>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentSlug = urlParams.get('hotel') || "royalstay";
        let currentClient = null;
        const scores = { cleanliness: 5, staff: 5, amenities: 5, food: 5 };

        function setScore(metric, val) {
            scores[metric] = val;
            const container = document.querySelector(`[data-metric="${metric}"]`);
            container.querySelectorAll('.rating-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === val);
            });
        }

        async function initTenant() {
            try {
                const res = await fetch(`masterdata.json?_ts=${Date.now()}`);
                const registry = await res.json();
                currentClient = registry[currentSlug];
                if (currentClient) {
                    document.getElementById('propTitle').innerText = `${currentClient.name} - Review`;
                }
            } catch (e) {}
        }

        function submitFeedback() {
            const room = document.getElementById('custRoom').value.trim();
            const name = document.getElementById('custName').value.trim();
            if (!room || !name) return alert("Room and name are required.");

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Transmitting...";

            fetch(currentClient.scriptUrl, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "submitFeedback",
                    roomNo: room,
                    guestName: name,
                    cleanliness: scores.cleanliness,
                    staff: scores.staff,
                    amenities: scores.amenities,
                    food: scores.food,
                    comments: document.getElementById('custComments').value.trim()
                })
            })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    document.getElementById('formCard').classList.add('hidden-view');
                    document.getElementById('successCard').classList.remove('hidden-view');
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerText = "Transmit Evaluation";
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTenant();
        });
    </script>
</body>
</html>
