<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception - Ofbuzz PMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #F3F4F6; color: #111; } .hidden-view{display:none !important;}</style>
</head>
<body class="min-h-screen flex flex-col p-4 font-sans">
    
    <!-- LOGIN BOX -->
    <div id="authBox" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-sm w-full">
            <h2 class="text-2xl font-black mb-2 text-indigo-600">Ofbuzz PMS</h2>
            <p class="text-xs text-gray-500 mb-6">Enter Shop ID</p>
            <input type="password" id="pinInput" class="w-full text-center text-3xl tracking-widest p-3 border rounded-lg mb-4" placeholder="••••">
            <button onclick="login()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700">Login</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <main id="dashBox" class="hidden-view max-w-7xl w-full mx-auto space-y-6">
        <header class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Front Desk Control</h1>
            <button onclick="fetchData()" class="bg-gray-100 px-4 py-2 rounded-lg text-sm font-bold">Sync</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-5 rounded-xl shadow">
                <h2 class="text-sm font-bold uppercase mb-4 text-gray-500">Live Inventory Matrix</h2>
                <div id="roomGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow border-l-4 border-orange-500">
                <h2 class="text-sm font-bold uppercase mb-4 text-orange-600">Food Order Approvals</h2>
                <div id="approvalQueue" class="space-y-3 text-sm"></div>
            </div>
        </div>
    </main>

    <!-- ROOM ACTION MODAL (Vacant Room Options) -->
    <div id="actionModal" class="hidden-view fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm space-y-4 text-center">
            <h3 class="font-bold text-lg border-b pb-2">Room <span id="actRoomText"></span></h3>
            <button onclick="openCheckIn()" class="w-full bg-green-600 text-white py-3 rounded font-bold">Proceed to Check-In</button>
            <button onclick="changeStatus('Maintenance')" class="w-full bg-gray-200 text-gray-800 py-3 rounded font-bold border">Mark Unavailable / Maintenance</button>
            <button onclick="closeModals()" class="w-full py-2 text-sm text-gray-500 font-bold">Cancel</button>
        </div>
    </div>

    <!-- RESTORE MODAL (Cleaning/Maintenance to Vacant) -->
    <div id="restoreModal" class="hidden-view fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm space-y-4 text-center">
            <h3 class="font-bold text-lg border-b pb-2">Room <span id="restRoomText"></span></h3>
            <p class="text-sm text-gray-500">Is this room ready for guests?</p>
            <button onclick="changeStatus('Vacant')" class="w-full bg-blue-600 text-white py-3 rounded font-bold">Mark as Available (Vacant)</button>
            <button onclick="closeModals()" class="w-full py-2 text-sm text-gray-500 font-bold">Cancel</button>
        </div>
    </div>

    <!-- CHECK-IN MODAL -->
    <div id="ciModal" class="hidden-view fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-md space-y-4">
            <h3 class="font-bold text-lg border-b pb-2">Check-In: Room <span id="ciRoomText"></span></h3>
            <input type="text" id="ciName" placeholder="Guest Name (Leave blank to trigger alert)" class="w-full border p-2 rounded">
            <input type="text" id="ciPhone" placeholder="Phone Number" class="w-full border p-2 rounded">
            <input type="number" id="ciAdvance" placeholder="Advance Payment (₹)" class="w-full border p-2 rounded">
            
            <div class="bg-gray-50 p-3 rounded text-sm">
                <p class="font-bold mb-2">Provided Essentials:</p>
                <label class="flex items-center gap-2"><input type="checkbox" id="chkSoap" class="essentials"> Soap & Shampoo</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="chkTowel" class="essentials"> Fresh Towels</label>
                <label class="flex items-center gap-2"><input type="checkbox" id="chkWater" class="essentials"> Water Bottles</label>
            </div>
            
            <div class="flex gap-2">
                <button onclick="closeModals()" class="flex-1 border py-2 rounded font-bold">Cancel</button>
                <button onclick="doCheckIn()" class="flex-1 bg-green-600 text-white py-2 rounded font-bold">Check-In</button>
            </div>
        </div>
    </div>

    <!-- CHECK-OUT MODAL -->
    <div id="coModal" class="hidden-view fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm space-y-4 font-mono text-sm">
            <h3 class="font-sans font-bold text-lg border-b pb-2 text-red-600">Checkout: Room <span id="coRoomText"></span></h3>
            <div class="flex justify-between"><span>Room Tariff:</span> <span id="coTariff">₹0</span></div>
            <div class="flex justify-between"><span>Food Orders:</span> <span id="coFood">₹0</span></div>
            <div class="flex justify-between text-red-500"><span>Advance Paid:</span> <span id="coAdvance">-₹0</span></div>
            <hr>
            <div class="flex justify-between font-bold text-lg"><span>Final Payable:</span> <span id="coFinal">₹0</span></div>
            <select id="coMode" class="w-full border p-2 rounded mt-2 font-sans">
                <option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Card">Card</option>
            </select>
            <div class="flex gap-2 mt-4 font-sans">
                <button onclick="closeModals()" class="flex-1 border py-2 rounded font-bold">Close</button>
                <button onclick="doCheckOut()" class="flex-1 bg-red-600 text-white py-2 rounded font-bold">Settle & Checkout</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('hotel');
        let client = null, activeRoom = null, activeBooking = null;
        let appData = { rooms: [], activeBookings: [], foodOrders: [], pendingOrders: [] };

        async function init() {
            const res = await fetch(`masterdata.json?_ts=${Date.now()}`);
            const data = await res.json();
            client = data[slug];
        }

        function login() {
            const pin = document.getElementById('pinInput').value;
            fetch(`${client.scriptUrl}?action=getReceptionData&pin=${pin}`)
                .then(r=>r.json()).then(res => {
                    if(res.success) {
                        appData = res;
                        document.getElementById('authBox').classList.add('hidden-view');
                        document.getElementById('dashBox').classList.remove('hidden-view');
                        renderRooms();
                        renderApprovals();
                    } else alert(res.error);
                });
        }

        function fetchData() { login(); }

        function closeModals() {
            ['actionModal', 'restoreModal', 'ciModal', 'coModal'].forEach(id => document.getElementById(id).classList.add('hidden-view'));
        }

        function renderRooms() {
            const grid = document.getElementById('roomGrid');
            grid.innerHTML = "";
            appData.rooms.forEach(r => {
                let color = r.Status === "Vacant" ? "bg-green-100 border-green-300 text-green-800" : 
                            r.Status === "Occupied" ? "bg-red-100 border-red-300 text-red-800" : 
                            r.Status === "Maintenance" ? "bg-gray-200 border-gray-400 text-gray-800" : "bg-yellow-100 border-yellow-300 text-yellow-800";
                
                let onclick = r.Status === "Vacant" ? `showActionOptions('${r.RoomNo}')` : 
                              r.Status === "Occupied" ? `openCheckOut('${r.RoomNo}', ${r.Price})` : `showRestoreOptions('${r.RoomNo}')`;
                
                grid.innerHTML += `<div onclick="${onclick}" class="p-4 border rounded-lg cursor-pointer ${color} hover:shadow-md transition">
                    <div class="font-bold text-lg">${r.RoomNo}</div>
                    <div class="text-[10px] uppercase font-bold">${r.Status}</div>
                </div>`;
            });
        }

        function showActionOptions(rNo) {
            activeRoom = rNo;
            document.getElementById('actRoomText').innerText = rNo;
            document.getElementById('actionModal').classList.remove('hidden-view');
        }

        function showRestoreOptions(rNo) {
            activeRoom = rNo;
            document.getElementById('restRoomText').innerText = rNo;
            document.getElementById('restoreModal').classList.remove('hidden-view');
        }

        function changeStatus(newStatus) {
            fetch(client.scriptUrl, { method: "POST", body: JSON.stringify({ action: "changeRoomStatus", roomNo: activeRoom, newStatus: newStatus }) })
            .then(()=> { closeModals(); fetchData(); });
        }

        function openCheckIn() {
            closeModals();
            document.getElementById('ciRoomText').innerText = activeRoom;
            document.querySelectorAll('.essentials').forEach(cb => cb.checked = false);
            document.getElementById('ciModal').classList.remove('hidden-view');
        }

        function doCheckIn() {
            const name = document.getElementById('ciName').value;
            const phone = document.getElementById('ciPhone').value;
            let ess = [];
            if(document.getElementById('chkSoap').checked) ess.push("Soap");
            if(document.getElementById('chkTowel').checked) ess.push("Towel");
            if(document.getElementById('chkWater').checked) ess.push("Water");
            const isMissing = (!name || !phone);

            fetch(client.scriptUrl, {
                method: "POST",
                body: JSON.stringify({ action: "checkIn", roomNo: activeRoom, guestName: name || "Unknown", phone: phone || "N/A", advance: document.getElementById('ciAdvance').value || 0, essentials: ess.join(","), idMissing: isMissing })
            }).then(()=> { closeModals(); fetchData(); });
        }

        function openCheckOut(rNo, price) {
            activeBooking = appData.activeBookings.find(b => b.RoomNo == rNo);
            if(!activeBooking) return;
            document.getElementById('coRoomText').innerText = rNo;
            const tariff = Number(price);
            const food = appData.foodOrders.filter(o => o.RoomNo == rNo && o.Status == "Approved").reduce((a,b)=>a+Number(b.Amount),0);
            const adv = Number(activeBooking.Advance || 0);
            const final = (tariff + food) - adv;
            document.getElementById('coTariff').innerText = `₹${tariff}`; document.getElementById('coFood').innerText = `₹${food}`;
            document.getElementById('coAdvance').innerText = `-₹${adv}`; document.getElementById('coFinal').innerText = `₹${final}`;
            activeBooking.calcData = { tariff, food, adv, final };
            document.getElementById('coModal').classList.remove('hidden-view');
        }

        function doCheckOut() {
            fetch(client.scriptUrl, { method: "POST", body: JSON.stringify({ 
                    action: "checkOut", bookingId: activeBooking.BookingId, roomNo: activeBooking.RoomNo,
                    roomTotal: activeBooking.calcData.tariff, foodTotal: activeBooking.calcData.food, 
                    advance: activeBooking.calcData.adv, finalPaid: activeBooking.calcData.final, paymentMode: document.getElementById('coMode').value
            })}).then(()=> { closeModals(); fetchData(); });
        }

        function renderApprovals() {
            const list = document.getElementById('approvalQueue');
            list.innerHTML = appData.pendingOrders.length ? "" : "<p class='text-gray-400'>No pending orders.</p>";
            appData.pendingOrders.forEach(o => {
                list.innerHTML += `<div class="p-3 border rounded bg-gray-50 flex justify-between items-center">
                    <div><b>Room ${o.RoomNo}</b><br><span class="text-xs text-gray-600">${o.Items} (₹${o.Amount})</span></div>
                    <button onclick="approveOrder('${o.OrderId}')" class="bg-orange-500 text-white px-3 py-1 rounded text-xs font-bold">Approve</button>
                </div>`;
            });
        }

        function approveOrder(id) {
            fetch(client.scriptUrl, { method:"POST", body: JSON.stringify({ action: "approveOrder", orderId: id }) }).then(()=> fetchData());
        }

        init();
    </script>
</body>
</html>
